# Builds a signed release APK and publishes it as a GitHub Release.
# Triggered by pushing a version tag, e.g.  git tag v0.2.0 && git push origin v0.2.0
# The signing key comes from repository secrets (see RELEASING.md); it is never in the repo.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # to create the release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Version from the tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Tag must look like v1.2.3 (got $GITHUB_REF_NAME)"; exit 1
          fi
          # Android needs an ever-increasing number: 1.2.3 -> 10203.
          CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build the signed APK
        env:
          WEALTH_KEYSTORE_BASE64: ${{ secrets.WEALTH_KEYSTORE_BASE64 }}
          WEALTH_KEYSTORE_PASSWORD: ${{ secrets.WEALTH_KEYSTORE_PASSWORD }}
          WEALTH_KEY_ALIAS: ${{ secrets.WEALTH_KEY_ALIAS }}
        run: |
          if [ -z "$WEALTH_KEYSTORE_BASE64" ] || [ -z "$WEALTH_KEYSTORE_PASSWORD" ] || [ -z "$WEALTH_KEY_ALIAS" ]; then
            echo "::error::Signing secrets are missing; see RELEASING.md"; exit 1
          fi
          export WEALTH_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$WEALTH_KEYSTORE_BASE64" | base64 --decode > "$WEALTH_KEYSTORE_FILE"
          ./gradlew assembleRelease \
            -PversionName=${{ steps.version.outputs.name }} \
            -PversionCode=${{ steps.version.outputs.code }}
          rm "$WEALTH_KEYSTORE_FILE"

      - name: Check the signature
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.name }}
        run: |
          APK="wealth-$VERSION.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          sha256sum "$APK" > "$APK.sha256"
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "Wealth $VERSION" --generate-notes
